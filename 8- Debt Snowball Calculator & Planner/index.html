<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مؤقت التركيز (Pomodoro)</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f9; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        #timer { font-size: 48px; font-weight: bold; color: #e74c3c; margin: 20px 0; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; color: white; }
        #start-btn { background: #3498db; }
        #reset-btn { background: #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="status">TIME TO FOCUS!</h2>
    <div id="timer">25:00</div>
    <button id="start-btn" onclick="startTimer()">Start 🚀</button>
    <button id="reset-btn" onclick="resetTimer()">Reset ⏹</button>
</div>

<script>
    let timeLeft = 1500; // 25 دقيقة
    let timerId = null;

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        if (timerId !== null) return; 
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerId = null;
                alert("انتهى وقت التركيز!");
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerId); // إيقاف العداد
        timerId = null; // تفريغ المعرف
        timeLeft = 1500; // إعادة الضبط لـ 25 دقيقة
        updateDisplay(); // تحديث العرض
    }
</script>

</body>
</html>

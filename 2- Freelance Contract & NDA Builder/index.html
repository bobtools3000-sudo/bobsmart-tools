<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Contract & NDA Builder</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #16a085;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
        }
        .contract-preview {
            margin-top: 30px;
            padding: 25px;
            border: 2px solid #34495e;
            background: #fff;
            min-height: 300px;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-line;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: #11806a; }
        .btn-secondary { background-color: var(--primary-color); color: white; }
        .btn-secondary:hover { background-color: #1a252f; }
        @media print {
            body * { visibility: hidden; }
            .contract-preview, .contract-preview * { visibility: visible; }
            .contract-preview { position: absolute; left: 0; top: 0; width: 100%; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Professional Contract & NDA Builder 📄✨</h1>
    
    <div class="grid">
        <div class="form-group">
            <label>Document Type</label>
            <select id="doc-type" onchange="generateContract()">
                <option value="freelance">Freelance Contract</option>
                <option value="nda">Non-Disclosure Agreement (NDA)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Agreement Date</label>
            <input type="date" id="doc-date" oninput="generateContract()">
        </div>
        <div class="form-group">
            <label>Party Information (First Party - Freelancer/Provider)</label>
            <input type="text" id="party-one" placeholder="Full Name or Company" oninput="generateContract()">
        </div>
        <div class="form-group">
            <label>Party Information (Second Party - Client)</label>
            <input type="text" id="party-two" placeholder="Full Name or Client Name" oninput="generateContract()">
        </div>
        <div class="form-group">
            <label>Project Title / Scope of Work</label>
            <input type="text" id="project-title" placeholder="e.g., E-commerce Website Development" oninput="generateContract()">
        </div>
        <div class="form-group">
            <label>Contract Value / Payment Terms</label>
            <input type="text" id="contract-value" placeholder="e.g., $1,500 USD total" oninput="generateContract()">
        </div>
    </div>

    <div class="form-group" style="margin-top: 15px;">
        <label>Custom Clauses / Additional Terms</label>
        <textarea id="custom-terms" rows="3" placeholder="Type any additional custom terms here..." oninput="generateContract()"></textarea>
    </div>

    <h3 style="margin-top: 30px; color: var(--primary-color);">Live Document Preview:</h3>
    <div class="contract-preview" id="contract-output">
        Please fill in the information above to generate the contract...
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="window.print()">Print or Save as PDF 🖨️</button>
        <button class="btn btn-secondary" onclick="copyContract()">Copy Text 📋</button>
    </div>
</div>

<script>
    document.getElementById('doc-date').valueAsDate = new Date();

    function generateContract() {
        const docType = document.getElementById('doc-type').value;
        const docDate = document.getElementById('doc-date').value;
        const partyOne = document.getElementById('party-one').value || '[First Party Name]';
        const partyTwo = document.getElementById('party-two').value || '[Second Party Name]';
        const projectTitle = document.getElementById('project-title').value || '[Project Title]';
        const contractValue = document.getElementById('contract-value').value || '[Contract Value]';
        const customTerms = document.getElementById('custom-terms').value;

        let contractText = "";

        if (docType === "freelance") {
            contractText = `FREELANCE SERVICES AGREEMENT

This Agreement is entered into on ${docDate}, by and between:
First Party (Service Provider): ${partyOne}
Second Party (Client): ${partyTwo}

Both parties agree to the following legally binding terms and conditions:

1. Scope of Work:
The First Party agrees to perform and deliver the project titled: (${projectTitle}) for the Second Party according to the agreed specifications.

2. Compensation & Payment:
The Second Party agrees to pay a total amount of (${contractValue}) to the First Party, payable upon milestone completions as agreed.

3. Intellectual Property:
All intellectual property and code ownership rights of the project shall be transferred to the Second Party immediately upon receipt of full payment.

4. Additional Terms:
${customTerms ? customTerms : "No additional terms specified."}

First Party Signature: ............................                     Second Party Signature: ............................`;
        } else {
            contractText = `NON-DISCLOSURE AGREEMENT (NDA)

This Non-Disclosure Agreement is made on ${docDate}, by and between:
First Party (Disclosing Party): ${partyOne}
Second Party (Receiving Party): ${partyTwo}

Terms and Conditions:

1. Confidential Information:
"Confidential Information" refers to any data, source code, designs, business plans, and documentation shared regarding the project: (${projectTitle}).

2. Obligations of Confidentiality:
The Receiving Party agrees to maintain absolute confidentiality and shall not disclose, publish, or leak any information to a third party without prior written consent.

3. Additional Terms:
${customTerms ? customTerms : "No additional terms specified."}

First Party Signature: ............................                     Second Party Signature: ............................`;
        }

        document.getElementById('contract-output').innerText = contractText;
    }

    function copyContract() {
        const text = document.getElementById('contract-output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Contract copied to clipboard! ✅');
        });
    }

    generateContract();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Contract & NDA Builder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; padding: 40px 20px; color: #334155; margin: 0; }
        .container { max-width: 900px; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); margin: 0 auto; }
        h2 { color: #1e293b; text-align: left; margin-top: 0; margin-bottom: 30px; font-size: 28px; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 20px; }
        .form-group { text-align: left; }
        .form-group.full-width { grid-column: span 2; }
        label { font-weight: 600; color: #475569; display: block; margin-bottom: 8px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #ffffff; color: #1e293b; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6; outline: none; }
        .section-title { grid-column: span 2; color: #1e3a8a; font-size: 15px; font-weight: 700; margin-top: 10px; margin-bottom: -10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .preview-title { color: #1e293b; font-size: 16px; font-weight: 700; margin-top: 40px; margin-bottom: 15px; text-align: left; }
        .contract-preview { background: #ffffff; border: 1px solid #e2e8f0; padding: 30px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; white-space: pre-line; max-height: 500px; overflow-y: auto; font-size: 14px; line-height: 1.6; color: #334155; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.02); }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
        .btn { flex: 1; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; text-align: center; transition: background 0.2s; text-decoration: none; }
        .btn:hover { background: #2563eb; }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }
    </style>
</head>
<body>

<div class="container">
    <h2>Professional Contract & NDA Builder</h2>

    <div class="grid-2">
        <!-- نوع العقد والتاريخ -->
        <div class="form-group">
            <label for="docType">Document Type</label>
            <select id="docType" oninput="updateContract()">
                <option value="contract">Freelance Contract</option>
                <option value="nda">Non-Disclosure Agreement (NDA)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="effectiveDate">Agreement Date</label>
            <input type="date" id="effectiveDate" oninput="updateContract()">
        </div>

        <!-- الطرف الأول -->
        <div class="section-title">Party Information (First Party - Client)</div>
        <div class="form-group">
            <label for="partyAName">Full Name or Company Name</label>
            <input type="text" id="partyAName" placeholder="e.g. Acme Corp" oninput="updateContract()">
        </div>
        <div class="form-group">
            <label for="partyAID">National ID / Passport / CR Number</label>
            <input type="text" id="partyAID" placeholder="e.g. 2950101XXXXXXX" oninput="updateContract()">
        </div>
        <div class="form-group full-width">
            <label for="partyAAddress">Official Address</label>
            <input type="text" id="partyAAddress" placeholder="e.g. 123 Nile St, Cairo, Egypt" oninput="updateContract()">
        </div>

        <!-- الطرف الثاني -->
        <div class="section-title">Party Information (Second Party - Freelancer)</div>
        <div class="form-group">
            <label for="partyBName">Full Name or Client Name</label>
            <input type="text" id="partyBName" placeholder="e.g. John Doe" oninput="updateContract()">
        </div>
        <div class="form-group">
            <label for="partyBID">National ID / Passport Number</label>
            <input type="text" id="partyBID" placeholder="e.g. 2990505XXXXXXX" oninput="updateContract()">
        </div>
        <div class="form-group full-width">
            <label for="partyBAddress">Official Address</label>
            <input type="text" id="partyBAddress" placeholder="e.g. 45 Freedom Sq, Giza, Egypt" oninput="updateContract()">
        </div>

        <!-- تفاصيل المشروع (تختفي في الـ NDA) -->
        <div id="projectSection" class="grid-2" style="grid-column: span 2; display: grid; gap: 24px; margin: 0; padding: 0;">
            <div class="section-title" style="grid-column: span 2;">Project & Payment Details</div>
            <div class="form-group">
                <label for="projectScope">Project Title / Scope of Work</label>
                <input type="text" id="projectScope" placeholder="e.g. E-commerce Website Development" oninput="updateContract()">
            </div>
            <div class="form-group">
                <label for="paymentAmount">Contract Value / Payment Terms</label>
                <input type="text" id="paymentAmount" placeholder="e.g. $1,500 USD total" oninput="updateContract()">
            </div>
        </div>

        <!-- شروط مخصصة -->
        <div class="section-title" style="grid-column: span 2;">Custom Clauses</div>
        <div class="form-group full-width">
            <label for="customTerms">Custom Clauses / Additional Terms</label>
            <textarea id="customTerms" rows="3" placeholder="Type any additional custom terms here..." oninput="updateContract()"></textarea>
        </div>
    </div>

    <!-- المعاينة الحية والتفاعلية بنفس الأسلوب القديم -->
    <div class="preview-title">Live Document Preview:</div>
    <div id="contractPreview" class="contract-preview"></div>

    <div class="actions">
        <button onclick="copyContract()" class="btn">Copy Text 📋</button>
        <button onclick="printContract()" class="btn" style="background: #10b981;">Print / Save as PDF 🖨️</button>
        <a href="../index.html" class="btn btn-secondary" style="flex: 0.5;">Main Hub</a>
    </div>
</div>

<script>
    // تعيين تاريخ اليوم تلقائياً
    document.getElementById('effectiveDate').valueAsDate = new Date();

    function updateContract() {
        const docType = document.getElementById('docType').value;
        const date = document.getElementById('effectiveDate').value || "[Date]";
        
        const pAName = document.getElementById('partyAName').value.trim() || "[Full Name or Company]";
        const pAID = document.getElementById('partyAID').value.trim() || "[National ID / Passport / CR Number]";
        const pAAddr = document.getElementById('partyAAddress').value.trim() || "[Official Address]";

        const pBName = document.getElementById('partyBName').value.trim() || "[Full Name or Client Name]";
        const pBID = document.getElementById('partyBID').value.trim() || "[National ID / Passport Number]";
        const pBAddr = document.getElementById('partyBAddress').value.trim() || "[Official Address]";
        
        const custom = document.getElementById('customTerms').value.trim();
        const projectSection = document.getElementById('projectSection');
        
        let template = "";

        if (docType === 'contract') {
            projectSection.style.display = 'grid';
            const scope = document.getElementById('projectScope').value.trim() || "e.g. E-commerce Website Development";
            const payment = document.getElementById('paymentAmount').value.trim() || "e.g. $1,500 USD total";
            
            template = `FREELANCE SERVICES AGREEMENT
            
            This Agreement is entered into as of ${date} by and between:
            
            First Party (Service Provider/Client): ${pAName}
            ID/Passport/CR: ${pAID} | Address: ${pAAddr}
            
            Second Party (Client/Freelancer): ${pBName}
            ID/Passport: ${pBID} | Address: ${pBAddr}
            
            Both parties agree to the following legally binding terms and conditions:
            
            1. Scope of Work
            The First Party agrees to perform and deliver the project titled: ${scope}.
            
            2. Compensation & Payments
            The Second Party agrees to pay a fixing amount of ${payment} as the full contract value upon delivery.
            
            3. Identity & Legal Validity
            Both parties declare under their legal responsibility that all national IDs, registration numbers, and addresses provided above are authentic and true.
            ${custom ? `\n4. Additional Terms & Clauses\n${custom}` : ''}
            
            IN WITNESS WHEREOF, the parties hereto have executed this Agreement as of the Effective Date.
            
            First Party Signature: __________________          Second Party Signature: __________________`;
        } else {
            projectSection.style.display = 'none';
            template = `NON-DISCLOSURE AGREEMENT (NDA)
            
            This Agreement is entered into as of ${date} by and between:
            
            First Party (Disclosing Party): ${pAName}
            ID/Passport/CR: ${pAID} | Address: ${pAAddr}
            
            Second Party (Receiving Party): ${pBName}
            ID/Passport: ${pBID} | Address: ${pBAddr}
            
            1. Confidential Information
            The Receiving Party agrees to hold all commercial, tech secrets, and data disclosed by the Disclosing Party in strict confidence.
            
            2. Identity & Legal Validity
            Both parties declare under their legal responsibility that all national IDs, registration numbers, and addresses provided above are authentic and true.
            ${custom ? `\n3. Additional Terms & Clauses\n${custom}` : ''}
            
            IN WITNESS WHEREOF, the parties hereto have executed this Agreement as of the Effective Date.
            
            Disclosing Party Signature: __________________          Receiving Party Signature: __________________`;
        }

        document.getElementById('contractPreview').innerText = template;
    }

    function copyContract() {
        const content = document.getElementById('contractPreview').innerText;
        navigator.clipboard.writeText(content).then(() => alert('Contract copied!'));
    }

    function printContract() {
        const content = document.getElementById('contractPreview').innerText;
        const printWindow = window.open('', '_blank');
        printWindow.document.write('<html><head><title>Print</title><style>body{font-family:monospace; padding:40px; line-height:1.6; white-space: pre-line;}</style></head><body>' + content + '</body></html>');
        printWindow.document.close();
        printWindow.print();
    }

    // تشغيل التحديث التلقائي لأول مرة عند فتح الصفحة
    updateContract();
</script>

</body>
</html>

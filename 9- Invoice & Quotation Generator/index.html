<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولد الفواتير وعروض الأسعار</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: auto; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>إنشاء فاتورة جديدة</h2>
    <input type="text" id="clientName" placeholder="اسم العميل">
    <input type="text" id="serviceName" placeholder="اسم الخدمة/المنتج">
    <input type="number" id="price" placeholder="السعر">
    <button onclick="generateInvoice()">توليد الفاتورة (PDF)</button>
    <div id="output"></div>
</div>

<script>
    function generateInvoice() {
        const client = document.getElementById('clientName').value;
        const service = document.getElementById('serviceName').value;
        const price = document.getElementById('price').value;

        if(!client || !price) {
            alert("يرجى تعبئة الحقول الأساسية!");
            return;
        }

        document.getElementById('output').innerHTML = `
            <h3>فاتورة موجهة لـ: ${client}</h3>
            <p>الخدمة: ${service}</p>
            <p>الإجمالي: ${price} ريال</p>
            <p><strong>تم التوليد بنجاح!</strong></p>
        `;
        // هنا سنضيف لاحقاً مكتبة jsPDF لتحويل هذا للـ PDF
    }
</script>

</body>
</html>

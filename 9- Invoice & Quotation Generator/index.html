<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Invoice & Quotation Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .invoice-box { background: white; padding: 30px; border-radius: 10px; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #219150; }
    </style>
</head>
<body>

<div class="invoice-box" id="invoice-content">
    <h2>Invoice Generator</h2>
    <input type="text" id="clientName" placeholder="Client Name">
    <input type="text" id="serviceName" placeholder="Service / Product">
    <input type="number" id="price" placeholder="Price">
    <button onclick="downloadPDF()">Download PDF</button>
</div>

<script>
    function downloadPDF() {
        const element = document.getElementById('invoice-content');
        const opt = {
            margin:       1,
            filename:     'invoice.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        // Convert the content to PDF and trigger download
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>

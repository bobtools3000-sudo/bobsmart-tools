<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Invoice Generator</h2>
    <input type="text" id="client" placeholder="Client Name">
    <input type="text" id="service" placeholder="Service">
    <input type="text" id="price" placeholder="Price">
    <button onclick="createPDF()">Download PDF</button>
</div>

<script>
    function createPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const client = document.getElementById('client').value;
        const service = document.getElementById('service').value;
        const price = document.getElementById('price').value;

        // إضافة النصوص (هذا لا يحتاج تصوير، هو يكتب نصوصاً مباشرة)
        doc.text("Invoice Details", 20, 20);
        doc.text("Client: " + client, 20, 30);
        doc.text("Service: " + service, 20, 40);
        doc.text("Price: " + price, 20, 50);

        // تحميل الملف
        doc.save("invoice_clean.pdf");
    }
</script>
</body>
</html>

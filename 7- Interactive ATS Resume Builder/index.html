<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>باني السيرة الذاتية الذكي</title>
    <style>
        body { font-family: sans-serif; display: flex; padding: 20px; gap: 20px; }
        .form-section { width: 40%; background: #f9f9f9; padding: 20px; border-radius: 10px; }
        .preview-section { width: 60%; padding: 20px; border: 2px solid #007bff; border-radius: 10px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-size: 16px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="form-section">
    <h2>بياناتك الأساسية</h2>
    <input type="text" id="name" placeholder="الاسم الكامل" oninput="update()">
    <input type="email" id="email" placeholder="البريد الإلكتروني" oninput="update()">
    <input type="tel" id="whatsapp" placeholder="رقم الواتساب" oninput="update()">
    <textarea id="skills" placeholder="المهارات (افصل بينها بفاصلة)" oninput="update()"></textarea>
    <button onclick="applyJobs()">تجهيز التقديم لـ 10 مواقع</button>
</div>

<div class="preview-section" id="cv">
    <h1 id="outName">...</h1>
    <p>البريد: <span id="outEmail">...</span></p>
    <p>واتساب: <span id="outWhatsapp">...</span></p>
    <h3>المهارات</h3>
    <p id="outSkills">...</p>
    <button onclick="window.print()">حفظ كـ PDF</button>
</div>

<script>
    function update() {
        document.getElementById('outName').innerText = document.getElementById('name').value;
        document.getElementById('outEmail').innerText = document.getElementById('email').value;
        document.getElementById('outWhatsapp').innerText = document.getElementById('whatsapp').value;
        document.getElementById('outSkills').innerText = document.getElementById('skills').value;
    }

    function applyJobs() {
        const jobSites = [
            "https://www.linkedin.com/jobs/",
            "https://wuzzuf.net/jobs/",
            "https://www.indeed.com/",
            "https://www.glassdoor.com/job-search.htm",
            "https://www.bayt.com/ar/jobs/"
        ];
        jobSites.forEach(url => window.open(url, '_blank'));
        alert("تم تجهيز 5 مواقع توظيف للتقديم! (تم فتحها في نوافذ جديدة)");
    }
</script>
</body>
</html>

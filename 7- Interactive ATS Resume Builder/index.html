<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>باني السيرة الذاتية التفاعلي</title>
    <!-- استعارة التنسيق الاحترافي الخاص بك -->
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; display: flex; padding: 20px; gap: 20px; }
        .form-panel { width: 35%; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .preview-panel { width: 65%; }
        
        /* تنسيق الـ CV الخاص بك */
        .cv-container { width: 100%; display: flex; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); overflow: hidden; background: #fff; }
        .sidebar { background: #1e2a38; color: #fff; width: 35%; padding: 30px; }
        .main-content { width: 65%; padding: 30px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .section-title { font-size: 18px; margin-bottom: 10px; border-bottom: 2px solid #a0c4ff; padding-bottom: 5px; }
        button { background: #28a745; color: white; padding: 10px; width: 100%; border: none; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-panel">
    <h2>أدخل بياناتك هنا</h2>
    <input type="text" id="inName" placeholder="الاسم الكامل" oninput="updateCV()">
    <input type="text" id="inTitle" placeholder="المسمى الوظيفي" oninput="updateCV()">
    <input type="text" id="inPhone" placeholder="رقم الهاتف" oninput="updateCV()">
    <textarea id="inSummary" placeholder="الملخص الشخصي" oninput="updateCV()"></textarea>
    <button onclick="window.print()">تصدير PDF احترافي</button>
</div>

<div class="preview-panel">
    <div class="cv-container">
        <aside class="sidebar">
            <h1 id="outName">الاسم</h1>
            <p id="outTitle">المسمى الوظيفي</p>
            <h2 class="section-title">الاتصال</h2>
            <p id="outPhone">...</p>
        </aside>
        <main class="main-content">
            <h2 class="section-title">الملخص الشخصي</h2>
            <p id="outSummary">...</p>
        </main>
    </div>
</div>

<script>
    function updateCV() {
        document.getElementById('outName').innerText = document.getElementById('inName').value;
        document.getElementById('outTitle').innerText = document.getElementById('inTitle').value;
        document.getElementById('outPhone').innerText = document.getElementById('inPhone').value;
        document.getElementById('outSummary').innerText = document.getElementById('inSummary').value;
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Markdown Editor & Previewer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --border: #cee1f2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 { margin: 0; font-size: 20px; }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #2980b9; }
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: #fff;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pane-title {
            background: #ebf3f9;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid var(--border);
        }
        textarea {
            width: 100%;
            height: 100%;
            border: none;
            padding: 20px;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            background: #fafafa;
        }
        #preview {
            padding: 20px;
            overflow-y: auto;
            height: 100%;
            box-sizing: border-box;
            border-left: 1px solid var(--border);
        }
        /* تنسيقات المعاينة */
        #preview h1, #preview h2, #preview h3 { color: var(--primary); }
        #preview code { background: #f1f2f6; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        #preview pre { background: #f1f2f6; padding: 15px; border-radius: 6px; overflow-x: auto; }
        #preview blockquote { border-left: 4px solid var(--accent); margin: 0; padding-left: 15px; color: #7f8c8d; }
        #preview table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        #preview th, #preview td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        #preview th { background-color: #f8f9fa; }

        @media print {
            .header, .pane-title, textarea { display: none !map; }
            #preview { border: none; padding: 0; height: auto; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>

<div class="header">
    <h1>Markdown Live Previewer & PDF Exporter 📝⚡</h1>
    <button class="btn" onclick="window.print()">Export to PDF / Print 🖨️</button>
</div>

<div class="editor-container">
    <div class="pane">
        <div class="pane-title">Markdown Editor (Type here)</div>
        <textarea id="markdown-input" oninput="updatePreview()" placeholder="# Hello World&#10;&#10;Type some **Markdown** here to see it render live on the right side!&#10;&#10;- Item 1&#10;- Item 2&#10;&#10;> Blockquotes look great too!"></textarea>
    </div>
    
    <div class="pane">
        <div class="pane-title">Live HTML Preview</div>
        <div id="preview"></div>
    </div>
</div>

<script>
    // القيمة الافتراضية عند فتح الأداة
    const defaultMarkdown = `# Live Markdown Editor 📝

Welcome to your advanced **Markdown Previewer**! Everything you type on the left updates instantly on the right.

## Features:
1. **Live Render:** Instant HTML preview.
2. **Text Styling:** Bold, *italics*, and strikethrough.
3. **Code Highlight:** Inline \`code\` or full blocks:
\`\`\`javascript
function greetUser() {
    console.log("Hello from the Markdown Editor!");
}
\`\`\`

> Feel free to delete this text and start writing your own content! Click the button above to print or save as a polished PDF.`;

    document.getElementById('markdown-input').value = defaultMarkdown;

    function updatePreview() {
        const markdownText = document.getElementById('markdown-input').value;
        // تحويل الـ Markdown إلى HTML باستخدام مكتبة marked
        document.getElementById('preview').innerHTML = marked.parse(markdownText);
    }

    // تشغيل المعاينة لأول مرة تلقائياً
    updatePreview();
</script>

</body>
</html>

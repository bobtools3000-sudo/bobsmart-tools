<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>باني السيرة الذاتية الاحترافي</title>
    <style>
        body { font-family: 'Cairo', sans-serif; display: flex; padding: 20px; gap: 20px; background: #f0f2f5; }
        .form-section { width: 40%; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .preview-section { width: 60%; background: white; padding: 40px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.05); min-height: 800px; }
        input, textarea, select { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        h2 { color: #007bff; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .cv-header { text-align: center; margin-bottom: 30px; }
        button { background: #007bff; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-section">
    <h2>أدخل بياناتك الاحترافية</h2>
    <input type="text" id="name" placeholder="الاسم الكامل" oninput="updateCV()">
    <input type="email" id="email" placeholder="البريد الإلكتروني" oninput="updateCV()">
    <input type="text" id="phone" placeholder="رقم الواتساب" oninput="updateCV()">
    <textarea id="summary" placeholder="ملخص احترافي عن خبراتك..." oninput="updateCV()"></textarea>
    
    <label>اختر أهم مهاراتك:</label>
    <select id="skills" onchange="addSkill()" multiple>
        <option value="البرمجة (Programming)">البرمجة</option>
        <option value="إدارة المشاريع (Project Management)">إدارة المشاريع</option>
        <option value="التصميم الجرافيكي (Graphic Design)">التصميم الجرافيكي</option>
        <option value="تحليل البيانات (Data Analysis)">تحليل البيانات</option>
    </select>
    <p><small>اضغط Ctrl لاختيار أكثر من مهارة</small></p>
</div>

<div class="preview-section" id="cv">
    <div class="cv-header">
        <h1 id="outName">الاسم الكامل</h1>
        <p>إيميل: <span id="outEmail">...</span> | واتساب: <span id="outPhone">...</span></p>
    </div>
    <h2>الملخص المهني</h2>
    <p id="outSummary">...</p>
    <h2>المهارات</h2>
    <ul id="outSkills"></ul>
    <button onclick="window.print()">تحميل كـ PDF احترافي</button>
</div>

<script>
    function updateCV() {
        document.getElementById('outName').innerText = document.getElementById('name').value;
        document.getElementById('outEmail').innerText = document.getElementById('email').value;
        document.getElementById('outPhone').innerText = document.getElementById('phone').value;
        document.getElementById('outSummary').innerText = document.getElementById('summary').value;
    }
    function addSkill() {
        const skillsSelect = document.getElementById('skills');
        const list = document.getElementById('outSkills');
        list.innerHTML = "";
        Array.from(skillsSelect.selectedOptions).forEach(option => {
            const li = document.createElement('li');
            li.innerText = option.value;
            list.appendChild(li);
        });
    }
</script>
</body>
</html>

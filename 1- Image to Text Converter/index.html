<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image to Text Converter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; text-align: center; margin: 0; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin: 40px auto; }
        h2 { color: #2c3e50; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        .upload-box { border: 2px dashed #3498db; padding: 40px 20px; border-radius: 10px; background: #f9fbfd; cursor: pointer; margin-bottom: 20px; transition: all 0.3s ease; position: relative; }
        .upload-box:hover { background: #f0f4f8; border-color: #2980b9; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        #imagePreview { max-width: 100%; max-height: 200px; display: none; margin-top: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 160px; margin-top: 20px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; resize: vertical; font-size: 15px; background: #fafafa; }
        .btn { display: inline-block; padding: 12px 24px; background: #3498db; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 15px 5px 0 5px; border: none; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn-back { background: #95a5a6; }
        .btn-back:hover { background: #7f8c8d; }
        .status { margin-top: 15px; font-weight: bold; color: #e67e22; font-size: 15px; }
        .progress-bar { width: 0%; height: 6px; background: #2ecc71; position: absolute; bottom: 0; left: 0; border-radius: 0 0 0 10px; transition: width 0.2s; }
    </style>
    <!-- استدعاء المكتبة من سيرفر CDN عالمي ومستقر يدعم التشغيل أونلاين -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
</head>
<body>

<div class="container">
    <h2>AI Image to Text Converter 🔍 ✨</h2>
    <p class="subtitle">Extract text from any image instantly. Supports multiple languages with 100% privacy.</p>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span class="upload-icon">📁</span>
        <p id="uploadText">Click to upload an image or drag & drop it here</p>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="processImage(this)">
        <img id="imagePreview" alt="Preview">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="statusText" class="status"></div>

    <textarea id="outputBox" readonly placeholder="Extracted text will appear here..."></textarea>

    <button onclick="copyText()" class="btn">Copy Extracted Text 📋</button>
    <br>
    <a href="../index.html" class="btn btn-back">Return to Main Hub</a>
</div>

<script>
    function processImage(input) {
        const file = input.files[0];
        if (!file) return;

        // عرض الصورة المرفوعة فوراً للمستخدم
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById('imagePreview');
            const uploadText = document.getElementById('uploadText');
            preview.src = e.target.result;
            preview.style.display = 'inline-block';
            uploadText.style.display = 'none';
        }
        reader.readAsDataURL(file);

        const status = document.getElementById('statusText');
        const output = document.getElementById('outputBox');
        const pBar = document.getElementById('progressBar');
        
        status.innerText = "🌀 Initializing AI Engine...";
        output.value = "";
        pBar.style.width = "5%";

        // تشغيل محرك التعرف على النصوص الاحترافي
        Tesseract.recognize(
            file,
            'eng',
            { 
                logger: m => {
                    if(m.status === 'recognizing') {
                        const progress = Math.round(m.progress * 100);
                        status.innerText = `⏳ Extracting Text: ${progress}%`;
                        pBar.style.width = `${progress}%`;
                    }
                } 
            }
        ).then(({ data: { text } }) => {
            status.innerText = "✅ Success! Text Extracted.";
            pBar.style.width = "100%";
            output.value = text.trim() ? text.trim() : "No clear text found. Please upload a clear screenshot containing English text.";
        }).catch(err => {
            console.error(err);
            status.innerText = "❌ Connection error or unsupported image format.";
            output.value = "Please refresh the page and try again with a standard PNG or JPG screenshot.";
        });
    }

    function copyText() {
        const textBox = document.getElementById('outputBox');
        if(!textBox.value) return;
        textBox.select();
        document.execCommand('copy');
        alert('Text copied successfully!');
    }
</script>

</body>
</html>

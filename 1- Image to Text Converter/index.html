<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image to Text Converter</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #2f3640;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: var(--secondary-color);
            text-align: center;
            margin-bottom: 10px;
        }
        p.desc {
            text-align: center;
            color: #718093;
            margin-bottom: 25px;
        }
        .upload-area {
            border: 2px dashed var(--primary-color);
            background-color: #f8f9fa;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background-color: #e8f4fd;
        }
        .upload-area img {
            width: 50px;
            margin-bottom: 10px;
        }
        #image-input { display: none; }
        
        .progress-container {
            display: none;
            margin: 20px 0;
        }
        .progress-bar {
            width: 100%;
            background-color: #dcdde1;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 10px;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.2s;
        }
        .status-text {
            font-size: 14px;
            color: #718093;
            margin-top: 5px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
        }
        .btn-copy {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn-copy:hover {
            background-color: var(--secondary-color);
        }
    </style>
    <!-- مكتبة Tesseract الذكية لقراءة النصوص -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
    <h1>AI Image to Text Converter 🔍✨</h1>
    <p class="desc">Extract text from any image instantly. Supports multiple languages with 100% privacy.</p>
    
    <div class="upload-area" onclick="document.getElementById('image-input').click()">
        <span style="font-size: 40px;">📂</span>
        <p style="font-weight: bold; margin: 10px 0 0 0;">Click to upload an image or drag & drop it here</p>
        <input type="file" id="image-input" accept="image/*">
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-text" id="status-text">Idle - Waiting for image...</div>
    </div>

    <textarea id="output-text" placeholder="The extracted text will appear here..." readonly></textarea>
    <button class="btn-copy" onclick="copyText()">Copy Extracted Text 📋</button>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progress-fill');
    const statusText = document.getElementById('status-text');
    const outputText = document.getElementById('output-text');

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        progressContainer.style.display = 'block';
        outputText.value = '';
        recognizeText(file);
    });

    function recognizeText(file) {
        Tesseract.recognize(
            file,
            'eng', // يدعم الإنجليزية افتراضياً، يمكنك التغيير لـ ara إذا أردت
            {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        statusText.innerText = `Extracting text... ${(m.progress * 100).toFixed(0)}%`;
                        progressFill.style.width = `${m.progress * 100}%`;
                    } else {
                        statusText.innerText = m.status;
                    }
                }
            }
        ).then(({ data: { text } }) => {
            statusText.innerText = "Text extracted successfully! ✅";
            progressContainer.style.display = 'none';
            if(text.trim() === "") {
                outputText.value = "No text found in this image.";
            } else {
                outputText.value = text;
            }
        }).catch(err => {
            console.error(err);
            statusText.innerText = "Error extracting text. Please try again.";
        });
    }

    function copyText() {
        if(!outputText.value.trim()) return;
        navigator.clipboard.writeText(outputText.value).then(() => {
            alert('Text copied to clipboard! ✅');
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Text Tools Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; text-align: center; margin: 0; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin: 40px auto; }
        h2 { color: #2c3e50; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        .input-area { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; color: #34495e; display: block; margin-bottom: 8px; }
        textarea { width: 100%; height: 140px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; resize: vertical; font-size: 15px; background: #fafafa; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-purple { background: #9b59b6; }
        .btn-purple:hover { background: #8e44ad; }
        .btn-back { background: #95a5a6; grid-column: span 2; margin-top: 10px; text-decoration: none; text-align: center; color: white; line-height: 20px; }
        .btn-back:hover { background: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Text Analyzer & Converter 📝 ✨</h2>
    <p class="subtitle">Clean, format, listen, and transform your text instantly with zero delay.</p>
    
    <div class="input-area">
        <label for="textBox">Type or Paste your text below:</label>
        <textarea id="textBox" placeholder="Enter your English text here to format or listen to it..."></textarea>
    </div>

    <div class="tools-grid">
        <button onclick="transformText('up')" class="btn">UPPERCASE ⬆️</button>
        <button onclick="transformText('low')" class="btn">lowercase ⬇️</button>
        <button onclick="transformText('clear')" class="btn">Clear Extra Spaces 🧼</button>
        <button onclick="speakText()" class="btn btn-purple">Listen to Text 🔊</button>
        <button onclick="copyText()" class="btn btn-success" style="grid-column: span 2;">Copy Processed Text 📋</button>
        <a href="../index.html" class="btn btn-back">Return to Main Hub</a>
    </div>
</div>

<script>
    function transformText(type) {
        const txtBox = document.getElementById('textBox');
        if(!txtBox.value) return alert('Please enter some text first!');
        
        if(type === 'up') {
            txtBox.value = txtBox.value.toUpperCase();
        } else if(type === 'low') {
            txtBox.value = txtBox.value.toLowerCase();
        } else if(type === 'clear') {
            txtBox.value = txtBox.value.replace(/\s+/g, ' ').trim();
        }
    }

    function speakText() {
        const txtBox = document.getElementById('textBox');
        if(!txtBox.value) return alert('Please enter text to read aloud!');
        
        // استخدام محرك الصوت المدمج بالمتصفح مباشرة بدون سيرفرات خارجية
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(txtBox.value);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }

    function copyText() {
        const textBox = document.getElementById('textBox');
        if(!textBox.value) return;
        textBox.select();
        document.execCommand('copy');
        alert('Text copied successfully!');
    }
</script>

</body>
</html>

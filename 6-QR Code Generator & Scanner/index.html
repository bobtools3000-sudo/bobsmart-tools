<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة QR الذكية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #qrcode { margin: 20px auto; width: 200px; height: 200px; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; }
        input { padding: 10px; width: 80%; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>مولد وقارئ QR</h1>
    
    <input type="text" id="textInput" placeholder="أدخل الرابط هنا...">
    <button onclick="generateQR()">توليد QR</button>
    <div id="qrcode"></div>

    <hr>

    <button onclick="startScan()">بدء المسح بالكاميرا</button>
    <div id="reader"></div>

    <script>
        function generateQR() {
            const text = document.getElementById('textInput').value;
            const qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            if(text.trim() !== "") {
                new QRCode(qrcodeDiv, { text: text, width: 200, height: 200 });
            } else {
                alert("يرجى إدخال نص!");
            }
        }

        function startScan() {
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render((text) => {
                alert("تمت القراءة: " + text);
                scanner.clear();
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة QR الذكية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #qrcode { margin: 20px auto; width: 200px; height: 200px; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border: 1px solid #ccc; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; }
        button { padding: 15px 25px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 8px; margin: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>مولد وقارئ QR</h1>
    
    <input type="text" id="textInput" placeholder="أدخل الرابط أو النص هنا...">
    <br>
    <button onclick="generateQR()">توليد QR</button>
    <div id="qrcode"></div>

    <hr>

    <button onclick="startScan()">بدء المسح بالكاميرا الخلفية</button>
    <div id="reader"></div>

    <script>
        // 1. وظيفة التوليد
        function generateQR() {
            const text = document.getElementById('textInput').value;
            const qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            if(text.trim() !== "") {
                new QRCode(qrcodeDiv, { text: text, width: 200, height: 200, correctLevel: 2 });
            } else {
                alert("يرجى إدخال نص!");
            }
        }

        // 2. وظيفة المسح النهائية
        function startScan() {
            const html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: { exact: "environment" } }, 
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    // هنا سيتم فتح الرابط فوراً في نافذة جديدة
                    window.open(decodedText, '_blank');
                    html5QrCode.stop(); // إيقاف الكاميرا بعد الفتح
                },
                (errorMessage) => {
                    // صمت عن الأخطاء أثناء المسح
                }
            ).catch((err) => {
                // في حال فشل الكاميرا الخلفية، جرب الأمامية
                html5QrCode.start(
                    { facingMode: "user" }, 
                    { fps: 10, qrbox: 250 },
                    (decodedText) => { 
                        window.open(decodedText, '_blank'); 
                        html5QrCode.stop(); 
                    }
                );
            });
        }
    </script>
</body>
</html>
